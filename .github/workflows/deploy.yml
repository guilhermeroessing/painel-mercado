name: deploy

on:
  push:
    branches: [main, claude/zealous-ritchie-udqtv9, claude/vibrant-hawking-ojj43u]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_VERSAO: ${{ github.sha }}
      - name: Publicar na Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::VERCEL_TOKEN, VERCEL_ORG_ID ou VERCEL_PROJECT_ID ausente: deploy ignorado."
            exit 0
          fi
          # Diagnóstico: HTTP de cada endpoint que o CLI usa; a resposta de erro da API diz o motivo.
          for url in \
            "https://api.vercel.com/v2/teams/$VERCEL_ORG_ID" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"; do
            status=$(curl -s -o /tmp/vercel-resposta.json -w '%{http_code}' \
              -H "Authorization: Bearer $VERCEL_TOKEN" "$url")
            echo "Vercel $url -> HTTP $status"
            if [ "$status" != "200" ]; then
              head -c 400 /tmp/vercel-resposta.json; echo
              echo "::error::Vercel recusou a chamada (HTTP $status). Confira VERCEL_TOKEN (escopo da equipe), VERCEL_ORG_ID e VERCEL_PROJECT_ID."
              exit 1
            fi
          done
          # Vincula a pasta publicada ao projeto, para o CLI não depender de variáveis de ambiente.
          mkdir -p frontend/out/.vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > frontend/out/.vercel/project.json
          cd frontend/out
          npx vercel@41.0.2 deploy --prod --yes --token "$VERCEL_TOKEN" --debug
